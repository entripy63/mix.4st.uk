# Included only inside m.4st.uk's existing HTTPS VirtualHost.
Alias "/_stream-path-__ID__/" "/opt/stream-path-diagnostic/www/"
<Directory "/opt/stream-path-diagnostic/www">
    Options -Indexes
    AllowOverride None
    SSLOptions +StdEnvVars
    Require all denied
    <Files "sample.php">
        Require all granted
    </Files>
</Directory>
SetEnvIf Request_URI "^/_stream-path-__ID__/sample\.php$" StreamPathProbe
CustomLog /var/log/apache2/stream-path-apache.log "time=%{%Y-%m-%dT%H:%M:%S%z}t peer=%{c}a remote=%a http=%H tls=%{SSL_PROTOCOL}x cipher=%{SSL_CIPHER}x sni=%{SSL_TLS_SNI}x status=%>s bytes=%B request=\"%r\" host=\"%{Host}i\" ua=\"%{User-Agent}i\" cf_ray=\"%{CF-Ray}i\" cf_worker=\"%{CF-Worker}i\"" env=StreamPathProbe
