name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # Playwright 1.59.1 supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start virtual audio output
        id: audio
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio rate=48000 channels=2
          pactl set-default-sink ci_audio
          pactl info
          pactl list short sinks

      - name: Run Full Verification
        run: npm run verify:full:ci

      - name: Run Sensitivity Checks
        run: npm run verify:sensitivity:ci

      # Observe the standalone handoff even when the unchanged app tests fail.
      - name: Run standalone MediaStream diagnostic
        if: ${{ !cancelled() && steps.audio.outcome == 'success' }}
        timeout-minutes: 6
        run: node tools/mediastream-probe.mjs

      - name: Upload standalone MediaStream measurements
        if: ${{ !cancelled() && steps.audio.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: mediastream-probe
          path: test-results/mediastream-probe.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
