name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    # Playwright 1.59.1 supports Ubuntu 24.04, not the newer ubuntu-latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start virtual audio output
        run: |
          sudo apt-get install -y pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio rate=48000 channels=2
          pactl set-default-sink ci_audio
          pactl info
          pactl list short sinks

      - name: Run Full Verification
        run: npm run verify:full:ci

      - name: Run Sensitivity Checks
        run: npm run verify:sensitivity:ci
